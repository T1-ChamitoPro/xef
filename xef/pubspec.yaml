name: xef
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  provider: ^6.1.2
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/xef-logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#080909"
  image: "lib/assets/xef-splash.png"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: "#080909"
    image: "lib/assets/xef-splash.png"
    icon_background_color: "#101112"

flutter:
  uses-material-design: true
  assets:
    - .env