spring.application.name=xef-backend

# =======================================================
# Configuración de Base de Datos (PostgreSQL / Supabase)
# =======================================================
# Puedes usar variables de entorno o configurar directamente tus credenciales de Supabase:
# Ejemplo URL Supabase: jdbc:postgresql://db.[TU-PROYECTO-REF].supabase.co:5432/postgres?sslmode=require
# O mediante Transaction Pooler: jdbc:postgresql://aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=jdbc:postgresql://db.ixvkljwmjqntvuftqnot.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=31433477Xef.
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================================================
# Configuración de JPA / Hibernate
# =======================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =======================================================
# Configuración de Seguridad & JWT
# =======================================================
# Secreto para firmar tokens JWT (mínimo 256 bits / 32+ caracteres)
xef.jwt.secret=${JWT_SECRET:xef_super_secret_jwt_key_2026_antigravity_fitness_ai_platform_key_must_be_very_long}
# Tiempo de expiración del token en milisegundos (24 horas = 86400000 ms)
xef.jwt.expiration-ms=86400000
# Tiempo de expiración del token de restablecimiento de contraseña (1 hora = 3600000 ms)
xef.jwt.reset-password-expiration-ms=3600000

# =======================================================
# Configuración del Servidor
# =======================================================
server.port=${PORT:8080}
server.servlet.context-path=/
